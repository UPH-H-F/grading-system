<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - UPHSD Grading System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="shared.js"></script>
</head>
<body class="bg-gray-50">
    <div id="sidebar"></div>
    <div id="header"></div>

    <main class="ml-64 mt-24 p-8">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-[#800000] mb-2">User Management</h1>
            <p class="text-gray-600 border-l-4 border-[#FFD700] pl-4">Manage system users, roles, and permissions</p>
        </div>

        <!-- View Toggle -->
        <div class="mb-6 flex gap-2">
            <button onclick="switchView('list')" id="listViewBtn" class="btn-primary">📋 List View</button>
            <button onclick="switchView('grid')" id="gridViewBtn" class="btn-secondary">🎯 Grid View</button>
            <button onclick="openCreateUserModal()" class="btn-primary ml-auto">➕ Add User</button>
        </div>

        <!-- Search -->
        <div class="mb-6">
            <input type="text" id="searchInput" placeholder="Search by name, ID, or email..." class="focus-ring w-full px-4 py-3 border-2 border-gray-300 rounded-lg">
        </div>

        <!-- List View -->
        <div id="listView" class="card">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- Populated by JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- Grid View -->
        <div id="gridView" class="hidden grid-view">
            <!-- Populated by JavaScript -->
        </div>
    </main>

    <!-- Edit User Modal -->
    <div id="editModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-lg shadow-2xl p-8 max-w-md w-full">
            <h2 class="text-2xl font-bold text-[#800000] mb-6">Edit User</h2>
            <form onsubmit="handleEditUser(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">User ID</label>
                    <input type="text" id="editUserId" class="focus-ring w-full px-4 py-2 border-2 border-gray-300 rounded-lg" disabled>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Name</label>
                    <input type="text" id="editUserName" class="focus-ring w-full px-4 py-2 border-2 border-gray-300 rounded-lg" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Email</label>
                    <input type="email" id="editUserEmail" class="focus-ring w-full px-4 py-2 border-2 border-gray-300 rounded-lg" required>
                </div>
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Role</label>
                    <select id="editUserRole" class="focus-ring w-full px-4 py-2 border-2 border-gray-300 rounded-lg" required>
                        <option value="admin">Admin</option>
                        <option value="faculty">Faculty</option>
                        <option value="supervisor">Supervisor</option>
                    </select>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-700 font-semibold mb-2">Status</label>
                    <select id="editUserStatus" class="focus-ring w-full px-4 py-2 border-2 border-gray-300 rounded-lg" required>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                    </select>
                </div>
                <div class="flex gap-4">
                    <button type="button" onclick="closeEditModal()" class="flex-1 btn-secondary">Cancel</button>
                    <button type="submit" class="flex-1 btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Check authentication
        const role = checkAuth();
        if (role !== ROLES.ADMIN) {
            window.location.href = 'index.html';
        }

        // Sample user data
        let users = [
            { id: 'USR001', name: 'Dr. Maria Santos', email: 'maria.santos@uphsd.edu', role: 'admin', status: 'active' },
            { id: 'USR002', name: 'Prof. Juan Dela Cruz', email: 'juan.delacruz@uphsd.edu', role: 'faculty', status: 'active' },
            { id: 'USR003', name: 'Dr. Patricia Reyes', email: 'patricia.reyes@uphsd.edu', role: 'supervisor', status: 'active' },
            { id: 'USR004', name: 'Prof. Carlos Mendoza', email: 'carlos.mendoza@uphsd.edu', role: 'faculty', status: 'active' },
            { id: 'USR005', name: 'Dr. Ana Garcia', email: 'ana.garcia@uphsd.edu', role: 'supervisor', status: 'inactive' },
        ];

        let currentEditingUser = null;

        // Initialize page
        document.getElementById('sidebar').innerHTML = getSidebarHTML(role, 'users');
        document.getElementById('header').innerHTML = getHeaderHTML(role);

        // Render users
        function renderUsers() {
            renderListView();
            renderGridView();
        }

        function renderListView() {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td><span class="font-semibold capitalize text-[#800000]">${user.role}</span></td>
                    <td>
                        <span class="status-badge ${user.status === 'active' ? 'status-passed' : 'status-failed'}">
                            ${user.status === 'active' ? '✓ Active' : '✗ Inactive'}
                        </span>
                    </td>
                    <td>
                        <button onclick="openEditModal('${user.id}')" class="text-[#800000] hover:underline font-semibold mr-3">Edit</button>
                        <button onclick="confirmResetPassword('${user.id}')" class="text-red-600 hover:underline font-semibold">Reset</button>
                    </td>
                </tr>
            `).join('');
        }

        function renderGridView() {
            const gridView = document.getElementById('gridView');
            gridView.innerHTML = users.map(user => `
                <div class="profile-card">
                    <img src="https://placehold.co/80x80/800000/FFFFFF?text=${user.role.charAt(0).toUpperCase()}" alt="${user.name}">
                    <div class="profile-card-name">${user.name}</div>
                    <div class="profile-card-id">${user.id}</div>
                    <div class="text-sm text-gray-600 mb-3">${user.email}</div>
                    <div class="text-sm mb-3">
                        <span class="font-semibold capitalize text-[#800000]">${user.role}</span>
                    </div>
                    <div class="text-sm mb-3">
                        <span class="status-badge ${user.status === 'active' ? 'status-passed' : 'status-failed'}">
                            ${user.status === 'active' ? '✓ Active' : '✗ Inactive'}
                        </span>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="openEditModal('${user.id}')" class="flex-1 text-sm btn-primary">Edit</button>
                        <button onclick="confirmResetPassword('${user.id}')" class="flex-1 text-sm bg-red-600 text-white py-2 rounded hover:bg-red-700">Reset</button>
                    </div>
                </div>
            `).join('');
        }

        function switchView(view) {
            const listView = document.getElementById('listView');
            const gridView = document.getElementById('gridView');
            const listBtn = document.getElementById('listViewBtn');
            const gridBtn = document.getElementById('gridViewBtn');

            if (view === 'list') {
                listView.classList.remove('hidden');
                gridView.classList.add('hidden');
                listBtn.classList.add('btn-primary');
                listBtn.classList.remove('btn-secondary');
                gridBtn.classList.remove('btn-primary');
                gridBtn.classList.add('btn-secondary');
            } else {
                listView.classList.add('hidden');
                gridView.classList.remove('hidden');
                listBtn.classList.remove('btn-primary');
                listBtn.classList.add('btn-secondary');
                gridBtn.classList.add('btn-primary');
                gridBtn.classList.remove('btn-secondary');
            }
        }

        function openEditModal(userId) {
            const user = users.find(u => u.id === userId);
            if (user) {
                currentEditingUser = userId;
                document.getElementById('editUserId').value = user.id;
                document.getElementById('editUserName').value = user.name;
                document.getElementById('editUserEmail').value = user.email;
                document.getElementById('editUserRole').value = user.role;
                document.getElementById('editUserStatus').value = user.status;
                document.getElementById('editModal').classList.remove('hidden');
            }
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.add('hidden');
            currentEditingUser = null;
        }

        function handleEditUser(event) {
            event.preventDefault();
            showConfirmation(
                'Confirm Changes',
                'Are you sure you want to save these changes?',
                'saveUserChanges'
            );
        }

        function saveUserChanges() {
            const user = users.find(u => u.id === currentEditingUser);
            if (user) {
                user.name = document.getElementById('editUserName').value;
                user.email = document.getElementById('editUserEmail').value;
                user.role = document.getElementById('editUserRole').value;
                user.status = document.getElementById('editUserStatus').value;
                renderUsers();
                closeEditModal();
                showSuccess('User updated successfully!');
            }
        }

        function confirmResetPassword(userId) {
            showConfirmation(
                'Reset Password',
                'Send password reset email to this user?',
                () => resetPassword(userId)
            );
        }

        function resetPassword(userId) {
            showSuccess('Password reset email sent successfully!');
        }

        function openCreateUserModal() {
            window.location.href = 'create-user.html';
        }

        // Search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = users.filter(user =>
                user.name.toLowerCase().includes(searchTerm) ||
                user.id.toLowerCase().includes(searchTerm) ||
                user.email.toLowerCase().includes(searchTerm)
            );
            
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = filtered.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td><span class="font-semibold capitalize text-[#800000]">${user.role}</span></td>
                    <td>
                        <span class="status-badge ${user.status === 'active' ? 'status-passed' : 'status-failed'}">
                            ${user.status === 'active' ? '✓ Active' : '✗ Inactive'}
                        </span>
                    </td>
                    <td>
                        <button onclick="openEditModal('${user.id}')" class="text-[#800000] hover:underline font-semibold mr-3">Edit</button>
                        <button onclick="confirmResetPassword('${user.id}')" class="text-red-600 hover:underline font-semibold">Reset</button>
                    </td>
                </tr>
            `).join('');
        });

        // Initial render
        renderUsers();
    </script>
</body>
</html>
