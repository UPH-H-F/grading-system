<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPHSD Grading System - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #800000 0%, #1a0000 100%);
        }
        .gold-accent {
            color: #FFD700;
        }
        .maroon-bg {
            background-color: #800000;
        }
        .maroon-hover:hover {
            background-color: #660000;
        }
        .focus-ring:focus {
            outline: 3px solid #FFD700;
            outline-offset: 2px;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="w-full max-w-md">
        <!-- Login Card -->
        <div id="loginForm" class="bg-white rounded-lg shadow-2xl p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold maroon-bg text-white py-2 rounded mb-2">UPHSD</h1>
                <p class="text-gray-600 text-sm">Comprehensive Grading System</p>
            </div>

            <form onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Institutional ID</label>
                    <input type="text" id="institutionalId" class="focus-ring w-full px-4 py-3 border-2 border-gray-300 rounded-lg" placeholder="Enter your ID" required>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Password</label>
                    <div class="relative">
                        <input type="password" id="password" class="focus-ring w-full px-4 py-3 border-2 border-gray-300 rounded-lg" placeholder="Enter your password" required>
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-3 text-gray-600">
                            <span id="toggleIcon">👁️</span>
                        </button>
                    </div>
                </div>

                <div class="mb-6">
                    <a href="#" class="text-sm gold-accent hover:underline">Forgot Password?</a>
                </div>

                <button type="submit" class="w-full maroon-bg text-white font-bold py-3 rounded-lg maroon-hover transition mb-4">
                    Login
                </button>
            </form>

            <div class="relative mb-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-2 bg-white text-gray-500">OR</span>
                </div>
            </div>

            <button onclick="showAdminLogin()" class="w-full bg-gray-800 text-white font-bold py-3 rounded-lg hover:bg-gray-900 transition">
                Admin Login
            </button>
        </div>

        <!-- Admin Login Card (Hidden) -->
        <div id="adminForm" class="bg-white rounded-lg shadow-2xl p-8 hidden">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold maroon-bg text-white py-2 rounded mb-2">UPHSD Admin</h1>
                <p class="text-gray-600 text-sm">Administrator Access</p>
            </div>

            <form onsubmit="handleAdminLogin(event)">
                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Admin ID</label>
                    <input type="text" id="adminId" class="focus-ring w-full px-4 py-3 border-2 border-gray-300 rounded-lg" placeholder="Enter admin ID" required>
                </div>

                <div class="mb-4">
                    <label class="block text-gray-700 font-semibold mb-2">Admin Password</label>
                    <div class="relative">
                        <input type="password" id="adminPassword" class="focus-ring w-full px-4 py-3 border-2 border-gray-300 rounded-lg" placeholder="Enter admin password" required>
                        <button type="button" onclick="toggleAdminPasswordVisibility()" class="absolute right-3 top-3 text-gray-600">
                            <span id="adminToggleIcon">👁️</span>
                        </button>
                    </div>
                </div>

                <button type="submit" class="w-full maroon-bg text-white font-bold py-3 rounded-lg maroon-hover transition mb-4">
                    Admin Login
                </button>
            </form>

            <button onclick="showUserLogin()" class="w-full bg-gray-800 text-white font-bold py-3 rounded-lg hover:bg-gray-900 transition">
                Back to User Login
            </button>
        </div>

        <!-- Role Selection Card (Hidden) -->
        <div id="roleSelection" class="bg-white rounded-lg shadow-2xl p-8 hidden">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold maroon-bg text-white py-2 rounded mb-2">Select Your Role</h1>
                <p class="text-gray-600 text-sm">Choose how you want to proceed</p>
            </div>

            <div class="space-y-4">
                <button onclick="proceedAs('faculty')" class="w-full bg-blue-600 text-white font-bold py-4 rounded-lg hover:bg-blue-700 transition">
                    📚 Proceed as Faculty
                </button>
                <button onclick="proceedAs('supervisor')" class="w-full bg-green-600 text-white font-bold py-4 rounded-lg hover:bg-green-700 transition">
                    👔 Proceed as Supervisor
                </button>
            </div>

            <button onclick="logout()" class="w-full bg-gray-800 text-white font-bold py-3 rounded-lg hover:bg-gray-900 transition mt-4">
                Logout
            </button>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = '👁️';
            }
        }

        function toggleAdminPasswordVisibility() {
            const passwordInput = document.getElementById('adminPassword');
            const toggleIcon = document.getElementById('adminToggleIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = '👁️';
            }
        }

        function showAdminLogin() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('adminForm').classList.remove('hidden');
        }

        function showUserLogin() {
            document.getElementById('adminForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
        }

        function handleLogin(event) {
            event.preventDefault();
            const id = document.getElementById('institutionalId').value;
            const password = document.getElementById('password').value;
            
            // Simple validation (in production, this would be server-side)
            if (id && password) {
                localStorage.setItem('userRole', 'pending');
                localStorage.setItem('userId', id);
                document.getElementById('loginForm').classList.add('hidden');
                document.getElementById('roleSelection').classList.remove('hidden');
            }
        }

        function handleAdminLogin(event) {
            event.preventDefault();
            const id = document.getElementById('adminId').value;
            const password = document.getElementById('adminPassword').value;
            
            if (id && password) {
                localStorage.setItem('userRole', 'admin');
                localStorage.setItem('userId', id);
                window.location.href = 'admin-dashboard.html';
            }
        }

        function proceedAs(role) {
            localStorage.setItem('userRole', role);
            if (role === 'faculty') {
                window.location.href = 'faculty-dashboard.html';
            } else if (role === 'supervisor') {
                window.location.href = 'supervisor-dashboard.html';
            }
        }

        function logout() {
            localStorage.removeItem('userRole');
            localStorage.removeItem('userId');
            document.getElementById('roleSelection').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('institutionalId').value = '';
            document.getElementById('password').value = '';
        }
    </script>
</body>
</html>
